name: Deploy OAuth Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/oauth/**"
      - ".github/workflows/deploy-oauth-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: workers/oauth

      - name: Check wrangler version + validate config
        working-directory: workers/oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== wrangler version ==="
          npx wrangler --version 2>&1
          echo "=== whoami ==="
          npx wrangler whoami 2>&1
          echo "=== deploy (dry run first) ==="
          npx wrangler deploy --dry-run 2>&1

      - name: Deploy
        working-directory: workers/oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_DISABLE_AUTOCONFIG: "1"
        run: npx wrangler deploy 2>&1
