name: Deploy OAuth Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/oauth/**"
      - ".github/workflows/deploy-oauth-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: workers/oauth

      - name: Deploy Worker
        working-directory: workers/oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_DISABLE_AUTOCONFIG: "1"
        run: npx wrangler deploy 2>&1
