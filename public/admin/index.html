<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>独立站后台管理系统</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      .r2-upload-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
      .r2-upload-box {
        background: #1e1e2e;
        border: 1px solid #45475a;
        border-radius: 12px;
        padding: 36px 48px;
        text-align: center;
        color: #cdd6f4;
        font-family: system-ui, -apple-system, sans-serif;
        min-width: 280px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .r2-upload-spinner {
        width: 36px; height: 36px;
        border: 3px solid #45475a;
        border-top-color: #89b4fa;
        border-radius: 50%;
        animation: r2-spin 0.8s linear infinite;
        margin: 12px auto;
      }
      @keyframes r2-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      (function registerR2Upload() {
        var CMS = window.CMS;
        if (!CMS) {
          setTimeout(registerR2Upload, 100);
          return;
        }

        var WORKER_UPLOAD = "https://awlvertexglowmarker.chinafang1234.workers.dev/upload";

        CMS.registerMediaLibrary({
          name: "r2-upload",

          init: function () {},

          show: function (opts) {
            var input = document.createElement("input");
            input.type = "file";
            input.accept = (opts.config && opts.config.accept) || "image/*";

            input.onchange = function () {
              var file = input.files[0];
              if (!file) return;

              var overlay = document.createElement("div");
              overlay.className = "r2-upload-overlay";
              overlay.innerHTML =
                '<div class="r2-upload-box"><div class="r2-upload-spinner"></div><p>正在上传到云存储…</p></div>';
              document.body.appendChild(overlay);

              var formData = new FormData();
              formData.append("file", file);

              fetch(WORKER_UPLOAD, { method: "POST", body: formData })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                  overlay.remove();
                  if (data.url) {
                    opts.onSelect(data.url);
                  } else {
                    alert("上传失败: " + (data.error || "未知错误"));
                  }
                })
                .catch(function (err) {
                  overlay.remove();
                  alert("上传失败: " + err.message);
                });
            };

            input.click();
          },

          enableStandalone: function () {
            return true;
          },
        });
      })();
    </script>
  </body>
</html>
