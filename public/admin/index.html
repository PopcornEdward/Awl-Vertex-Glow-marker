<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>独立站后台管理系统</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      .r2-upload-overlay {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.55);
        display: flex; align-items: center; justify-content: center;
        z-index: 99999;
      }
      .r2-upload-box {
        background: #1e1e2e;
        border: 1px solid #45475a;
        border-radius: 12px;
        padding: 36px 48px;
        text-align: center;
        color: #cdd6f4;
        font-family: system-ui, -apple-system, sans-serif;
        min-width: 280px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .r2-upload-spinner {
        width: 36px; height: 36px;
        border: 3px solid #45475a;
        border-top-color: #89b4fa;
        border-radius: 50%;
        animation: r2-spin 0.8s linear infinite;
        margin: 12px auto;
      }
      @keyframes r2-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      (function () {
        var WORKER_UPLOAD =
          "https://awlvertexglowmarker.chinafang1234.workers.dev/upload";
        var uploading = false;

        function showOverlay(text) {
          var el = document.createElement("div");
          el.className = "r2-upload-overlay";
          el.innerHTML =
            '<div class="r2-upload-box"><div class="r2-upload-spinner"></div><p>' +
            text +
            "</p></div>";
          document.body.appendChild(el);
          return el;
        }

        function uploadFile(file) {
          return new Promise(function (resolve, reject) {
            if (uploading) return reject(new Error("已有上传进行中"));
            uploading = true;
            var overlay = showOverlay("正在上传到云存储…");
            var fd = new FormData();
            fd.append("file", file);
            fetch(WORKER_UPLOAD, { method: "POST", body: fd })
              .then(function (r) {
                return r.json();
              })
              .then(function (data) {
                overlay.remove();
                uploading = false;
                if (data.url) resolve(data.url);
                else reject(new Error(data.error || "上传失败"));
              })
              .catch(function (err) {
                overlay.remove();
                uploading = false;
                reject(err);
              });
          });
        }

        // Set value on a text input and trigger Svelte reactivity
        function setInputValue(input, url) {
          var nativeSetter =
            Object.getOwnPropertyDescriptor(
              window.HTMLInputElement.prototype,
              "value"
            );
          if (nativeSetter && nativeSetter.set) {
            nativeSetter.set.call(input, url);
          } else {
            input.value = url;
          }
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.dispatchEvent(new Event("change", { bubbles: true }));
        }

        // Find a text input near the event target
        function findNearbyInput(el) {
          var node = el;
          while (node && node !== document.body) {
            if (node.querySelector) {
              var inp = node.querySelector(
                'input[type="text"], input:not([type])'
              );
              if (inp) return inp;
            }
            if (node.parentElement) {
              var sib = node.parentElement.querySelector(
                'input[type="text"], input:not([type])'
              );
              if (sib) return sib;
            }
            node = node.parentElement;
          }
          // Fallback: any visible text input in the page
          var inputs = document.querySelectorAll('input[type="text"]');
          for (var i = 0; i < inputs.length; i++) {
            var v = inputs[i].value;
            // Prefer input that already has an image URL
            if (v && (v.startsWith("http") || v.startsWith("/"))) {
              return inputs[i];
            }
          }
          return inputs.length > 0 ? inputs[0] : null;
        }

        // ── 1. Intercept PASTE (Ctrl+V) ──
        document.addEventListener(
          "paste",
          function (e) {
            var items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            for (var i = 0; i < items.length; i++) {
              if (items[i].type.indexOf("image/") === 0) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                var file = items[i].getAsFile();
                var input = document.activeElement;
                if (
                  input &&
                  (input.tagName === "INPUT" || input.tagName === "TEXTAREA")
                ) {
                  uploadFile(file).then(function (url) {
                    setInputValue(input, url);
                  });
                }
                return;
              }
            }
          },
          true
        );

        // ── 2. Intercept DROP (drag/drop) ──
        document.addEventListener(
          "drop",
          function (e) {
            var files = e.dataTransfer && e.dataTransfer.files;
            if (!files || files.length === 0) return;
            for (var i = 0; i < files.length; i++) {
              if (files[i].type.indexOf("image/") === 0) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                var input = findNearbyInput(e.target);
                if (input) {
                  uploadFile(files[i]).then(function (url) {
                    setInputValue(input, url);
                  });
                }
                return;
              }
            }
          },
          true
        );

        // ── 3. Intercept file input CHANGE (click Choose / browse) ──
        document.addEventListener(
          "change",
          function (e) {
            var target = e.target;
            if (
              !target ||
              target.type !== "file" ||
              !target.files ||
              !target.files[0]
            )
              return;
            var file = target.files[0];
            if (file.type.indexOf("image/") !== 0) return;

            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            var input = findNearbyInput(target);
            if (input) {
              uploadFile(file).then(function (url) {
                setInputValue(input, url);
              });
            } else {
              uploadFile(file).then(function (url) {
                alert("上传成功！\n" + url);
              });
            }
          },
          true
        );
      })();
    </script>
  </body>
</html>
